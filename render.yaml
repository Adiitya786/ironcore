services:
  - type: web
    name: ironcr-backend
    runtime: docker
    plan: free
    rootDir: ironcr-backend
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ironcr-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ironcr-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ironcr-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  - name: ironcr-db
    databaseName: ironcr_db
    user: ironcr_user
    plan: free
